name: SAHAAY Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    env:
      # Inline SQLite DB so no external service is needed in CI
      DATABASE_URL: "file:./prisma/ci-test.db"
      NODE_ENV: test
      JWT_SECRET: "sahaay_ci_test_secret_32_chars_ok"
      JWT_EXPIRES_IN: "1d"
      STORAGE_PROVIDER: local
      AI_PROVIDER: mock

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Generate Prisma Client (dual output)
        run: npm run db:generate

      - name: Create & Migrate Test Database
        run: npx prisma db push --schema=prisma/schema.prisma --accept-data-loss

      - name: Seed Demo Data into Test Database
        run: npm run db:seed

      - name: Code Quality & Linting Check
        run: npm run lint

      - name: Static Typecheck Verification
        run: npm run typecheck

      - name: Run Automated Test Suite
        run: npm test

      - name: Build Backend API Server
        run: npm run build:server

      - name: Build Frontend Web Client
        run: npm run build:client

