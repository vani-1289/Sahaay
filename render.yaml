services:
  - type: web
    name: sahaay-api
    env: node
    region: oregon
    plan: free
    buildCommand: >
      npm install --include=dev &&
      npm --prefix server install --include=dev &&
      npm run db:generate &&
      npm run build:server
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
