services:
  # ============================================================================
  # 1. SAHAAY Backend API Service
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: sahaay_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:/app/prisma/dev.db
      - CORS_ORIGIN=http://localhost:3000,http://localhost:5173,http://localhost:80
      - JWT_SECRET=sahaay_production_secret_key_change_me_2026
      - JWT_EXPIRES_IN=7d
      - AI_PROVIDER=mock
      - STORAGE_PROVIDER=local
      - STORAGE_PATH=/app/storage
      - MAX_FILE_SIZE_MB=15
    volumes:
      - sahaay_storage:/app/storage
      - sahaay_sqlite_data:/app/prisma
    networks:
      - sahaay_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # 2. SAHAAY Frontend Web Client (Nginx)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: sahaay_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sahaay_network

  # ============================================================================
  # 3. PostgreSQL + PostGIS (Production RDBMS with GIS Support)
  # ============================================================================
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: sahaay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sahaay_user
      POSTGRES_PASSWORD: sahaay_secure_password_2026
      POSTGRES_DB: sahaay_db
    ports:
      - "5432:5432"
    volumes:
      - sahaay_pgdata:/var/lib/postgresql/data
    networks:
      - sahaay_network
    profiles:
      - postgres

networks:
  sahaay_network:
    driver: bridge

volumes:
  sahaay_storage:
    driver: local
  sahaay_sqlite_data:
    driver: local
  sahaay_pgdata:
    driver: local
