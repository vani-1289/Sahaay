services:
  # ============================================================================
  # 1. PostgreSQL + PostGIS (Production RDBMS with GIS Support)
  # ============================================================================
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: sahaay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sahaay_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahaay_password}
      POSTGRES_DB: ${POSTGRES_DB:-sahaay_db}
    ports:
      - "5432:5432"
    volumes:
      - sahaay_pgdata:/var/lib/postgresql/data
    networks:
      - sahaay_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sahaay_user} -d ${POSTGRES_DB:-sahaay_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 2. SAHAAY Backend API Service
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: sahaay_backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sahaay_user}:${POSTGRES_PASSWORD:-sahaay_password}@postgres:5432/${POSTGRES_DB:-sahaay_db}?schema=public
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173,http://localhost:80}
      - JWT_SECRET=${JWT_SECRET:-sahaay_default_dev_jwt_secret_2026}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - AI_PROVIDER=${AI_PROVIDER:-ocr}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - STORAGE_PATH=/app/storage
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-15}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-sahaay-documents}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
    volumes:
      - sahaay_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sahaay_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # 3. SAHAAY Frontend Web Client (Nginx)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: sahaay_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sahaay_network

networks:
  sahaay_network:
    driver: bridge

volumes:
  sahaay_storage:
    driver: local
  sahaay_pgdata:
    driver: local
